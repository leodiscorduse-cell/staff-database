<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0d10; --surface: #13151a; --surface2: #1a1d25;
      --border: #252830; --accent: #5865f2; --accent2: #eb459e;
      --green: #57f287; --yellow: #fee75c; --red: #ed4245;
      --text: #e8eaf0; --muted: #5a5f72;
      --mono: 'Space Mono', monospace; --sans: 'Syne', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: rgba(12,13,16,0.92);
      backdrop-filter: blur(12px); z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo h1 { font-size: 18px; font-weight: 800; }
    .logo span { color: var(--muted); font-size: 13px; font-weight: 400; display: block; margin-top: 1px; }
    .sync-info { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; }
    .sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; }

    .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; border-bottom: 1px solid var(--border); background: var(--border); }
    .stat { background: var(--surface); padding: 20px 28px; }
    .stat-label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 800; line-height: 1; }
    .stat-value.accent { color: var(--accent); }
    .stat-value.yellow { color: var(--yellow); }
    .stat-value.pink   { color: var(--accent2); }
    .stat-value.green  { color: var(--green); }

    main { padding: 24px 32px; }
    .controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .search-wrap { flex: 1; min-width: 220px; position: relative; }
    .search-wrap input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px 10px 38px; color: var(--text); font-family: var(--mono); font-size: 13px; outline: none; transition: border-color 0.15s; }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
    .filter-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; color: var(--muted); font-family: var(--mono); font-size: 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-btn.loa.active { background: var(--yellow); border-color: var(--yellow); color: #000; }
    .filter-btn.ztp.active { background: var(--red); border-color: var(--red); color: #fff; }

    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: var(--surface2); padding: 12px 16px; text-align: left; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 400; border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; cursor: pointer; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 14px 16px; font-size: 14px; vertical-align: middle; }

    .user-cell { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; color: var(--accent); }
    .user-name { font-weight: 600; font-size: 14px; }
    .user-id { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 1px; }

    .role-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
    .badge-yes { background: rgba(87,242,135,0.12); color: var(--green); }
    .badge-yes .badge-dot { background: var(--green); }
    .badge-no  { background: rgba(90,95,114,0.15); color: var(--muted); }
    .date-cell { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .notes-cell { font-size: 12px; color: var(--muted); max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .no-notes { font-style: italic; color: var(--border); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto; transform: translateY(16px); transition: transform 0.2s; }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header { padding: 24px 24px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .modal-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: var(--accent); flex-shrink: 0; }
    .modal-user h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .modal-user p  { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px; transition: color 0.15s; line-height: 1; }
    .close-btn:hover { color: var(--text); }
    .modal-body { padding: 24px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .field label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); display: block; margin-bottom: 6px; }
    .field-val { font-size: 14px; font-weight: 600; }
    .roles-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .notes-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 12px; color: var(--text); min-height: 60px; white-space: pre-wrap; }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty h3 { font-size: 18px; margin-bottom: 8px; }
    .empty p  { font-size: 14px; font-family: var(--mono); }
    .loading { text-align: center; padding: 60px; color: var(--muted); font-family: var(--mono); font-size: 13px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🛡️</div>
    <div>
      <h1>Staff Database</h1>
      <span id="guild-name">Discord Server</span>
    </div>
  </div>
  <div class="sync-info">
    <span class="sync-dot"></span>GITHUB PAGES<br>
    <span id="last-sync">Last sync: —</span>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-label">Total Staff</div><div class="stat-value accent" id="stat-total">—</div></div>
  <div class="stat"><div class="stat-label">On LOA</div><div class="stat-value yellow" id="stat-loa">—</div></div>
  <div class="stat"><div class="stat-label">On ZTP</div><div class="stat-value pink" id="stat-ztp">—</div></div>
  <div class="stat"><div class="stat-label">Active</div><div class="stat-value green" id="stat-active">—</div></div>
</div>

<main>
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search" placeholder="Search username..." oninput="renderTable()" />
    </div>
    <button class="filter-btn loa" id="btn-loa" onclick="toggleFilter('loa')">🌴 LOA</button>
    <button class="filter-btn ztp" id="btn-ztp" onclick="toggleFilter('ztp')">⚠️ ZTP</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Member</th><th>Role</th><th>Joined Server</th><th>LOA</th><th>ZTP</th><th>Notes</th>
        </tr>
      </thead>
      <tbody id="staff-tbody">
        <tr><td colspan="6"><div class="loading">Loading staff...</div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div style="display:flex;gap:14px;align-items:center;">
        <div class="modal-avatar" id="m-avatar">?</div>
        <div class="modal-user"><h2 id="m-name">—</h2><p id="m-id">—</p></div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-grid">
        <div class="field"><label>Highest Role</label><div class="field-val" id="m-role">—</div></div>
        <div class="field"><label>Joined Server</label><div class="field-val date-cell" id="m-joined">—</div></div>
        <div class="field"><label>LOA Status</label><div class="field-val" id="m-loa">—</div></div>
        <div class="field"><label>ZTP Status</label><div class="field-val" id="m-ztp">—</div></div>
      </div>
      <div class="field" style="margin-bottom:16px;">
        <label>All Roles</label>
        <div class="roles-list" id="m-roles"></div>
      </div>
      <div class="field">
        <label>Notes</label>
        <div class="notes-box" id="m-notes">—</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ── CHANGE THIS to your raw GitHub staff.json URL ──
  const DATA_URL = 'https://raw.githubusercontent.com/leodiscorduse-cell/staff-database/main/staff-db/staff.json';

  const ROLE_COLORS = {
    'owner':           ['#f04747','#fff'],
    'co-owner':        ['#ff7b7b','#fff'],
    'admin':           ['#eb459e','#fff'],
    'senior moderator':['#5865f2','#fff'],
    'moderator':       ['#5865f2','#fff'],
    'trial moderator': ['#99aab5','#fff'],
    'helper':          ['#57f287','#000'],
    'staff':           ['#fee75c','#000'],
  };

  function roleStyle(name) {
    const key = (name || '').toLowerCase();
    for (const [k, [bg]] of Object.entries(ROLE_COLORS)) {
      if (key.includes(k)) return `background:${bg}22;color:${bg};border:1px solid ${bg}44`;
    }
    return 'background:#252830;color:#99aab5;border:1px solid #2e3240';
  }

  function badgeYN(val) {
    return val
      ? `<span class="status-badge badge-yes"><span class="badge-dot"></span>Yes</span>`
      : `<span class="status-badge badge-no">No</span>`;
  }

  function initials(name) {
    return (name || '?').split(/[\s#]+/).map(p => p[0]).join('').slice(0,2).toUpperCase();
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  let allStaff = [];
  let activeFilters = { loa: false, ztp: false };

  async function loadData() {
    try {
      const r = await fetch(DATA_URL + '?t=' + Date.now());
      const db = await r.json();
      allStaff = Object.values(db.staff || {});

      const total  = allStaff.length;
      const onLoa  = allStaff.filter(m => m.on_loa).length;
      const onZtp  = allStaff.filter(m => m.on_ztp).length;
      document.getElementById('stat-total').textContent  = total;
      document.getElementById('stat-loa').textContent    = onLoa;
      document.getElementById('stat-ztp').textContent    = onZtp;
      document.getElementById('stat-active').textContent = total - onLoa;

      const lastSync = db.sync_log?.[0]?.synced_at;
      if (lastSync) {
        document.getElementById('last-sync').textContent =
          'Last sync: ' + new Date(lastSync).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
      }

      renderTable();
    } catch(e) {
      document.getElementById('staff-tbody').innerHTML =
        `<tr><td colspan="6"><div class="empty"><h3>⚠️ Could not load data</h3><p>Make sure staff.json exists in your repo<br>and the repo is public.</p></div></td></tr>`;
    }
  }

  function renderTable() {
    const search = document.getElementById('search').value.toLowerCase();
    let staff = allStaff.filter(m => {
      if (search && !m.username.toLowerCase().includes(search) && !(m.nickname||'').toLowerCase().includes(search)) return false;
      if (activeFilters.loa && !m.on_loa) return false;
      if (activeFilters.ztp && !m.on_ztp) return false;
      return true;
    });

    staff.sort((a,b) => a.username.localeCompare(b.username));

    const tbody = document.getElementById('staff-tbody');
    if (!staff.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><h3>No staff found</h3><p>Try adjusting your filters.</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = staff.map(s => `
      <tr onclick="openModal('${s.user_id}')">
        <td><div class="user-cell">
          <div class="avatar">${initials(s.username)}</div>
          <div><div class="user-name">${esc(s.nickname || s.username.split('#')[0])}</div>
          <div class="user-id">${esc(s.username)}</div></div>
        </div></td>
        <td><span class="role-badge" style="${roleStyle(s.highest_role)}">${esc(s.highest_role)}</span></td>
        <td class="date-cell">${fmtDate(s.join_date)}</td>
        <td>${badgeYN(s.on_loa)}</td>
        <td>${badgeYN(s.on_ztp)}</td>
        <td class="notes-cell ${s.notes ? '' : 'no-notes'}">${s.notes ? esc(s.notes) : 'No notes'}</td>
      </tr>
    `).join('');
  }

  function toggleFilter(type) {
    activeFilters[type] = !activeFilters[type];
    document.getElementById(`btn-${type}`).classList.toggle('active', activeFilters[type]);
    renderTable();
  }

  function openModal(userId) {
    const s = allStaff.find(m => m.user_id === userId);
    if (!s) return;
    document.getElementById('m-avatar').textContent  = initials(s.username);
    document.getElementById('m-name').textContent    = s.nickname || s.username.split('#')[0];
    document.getElementById('m-id').textContent      = `ID: ${s.user_id} · ${s.username}`;
    document.getElementById('m-role').innerHTML      = `<span class="role-badge" style="${roleStyle(s.highest_role)}">${esc(s.highest_role)}</span>`;
    document.getElementById('m-joined').textContent  = fmtDate(s.join_date);
    document.getElementById('m-loa').innerHTML       = badgeYN(s.on_loa);
    document.getElementById('m-ztp').innerHTML       = badgeYN(s.on_ztp);
    document.getElementById('m-roles').innerHTML     = (s.roles||[]).map(r => `<span class="role-badge" style="${roleStyle(r)}">${esc(r)}</span>`).join('');
    document.getElementById('m-notes').textContent   = s.notes || 'No notes';
    document.getElementById('modal').classList.add('open');
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById('modal')) return;
    document.getElementById('modal').classList.remove('open');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('modal').classList.remove('open');
  });

  loadData();
</script>
</body>
</html>
